name: CD

# Runs after the CI workflow finishes on main.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: devops-demo
  K8S_DEPLOYMENT: devops-demo

jobs:
  publish:
    # Only continue if CI succeeded and was triggered by a push (not a PR).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${repo}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      # Base64-encoded kubeconfig stored as a repository secret.
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check for cluster credentials
        id: gate
        run: |
          if [ -z "${KUBE_CONFIG}" ]; then
            echo "::notice::KUBE_CONFIG secret is not set. Image was published, deploy skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-kubectl@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Configure kubectl
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        if: steps.gate.outputs.enabled == 'true'
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

      - name: Roll out the new image
        if: steps.gate.outputs.enabled == 'true'
        run: |
          kubectl -n "${K8S_NAMESPACE}" set image "deployment/${K8S_DEPLOYMENT}" \
            app="${{ needs.publish.outputs.image }}:${{ github.event.workflow_run.head_sha }}"
          kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${K8S_DEPLOYMENT}" --timeout=120s

      - name: Roll back on failure
        if: failure() && steps.gate.outputs.enabled == 'true'
        run: kubectl -n "${K8S_NAMESPACE}" rollout undo "deployment/${K8S_DEPLOYMENT}"
